name: Validate Codex Meter Android

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Android toolchain
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload phone test reports and widget previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/widget-previews/
          if-no-files-found: ignore

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          ./lint.sh

      # Branch and pull-request builds use debug signing; tag releases use android-release.yml.
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: codex-meter-phone-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
